<script>window.renderBubble = function renderBubble(ctx) {
  const root = document.getElementById('bubble');
  const content = document.getElementById('content');
  if (!root || !content) return;
  const sprinkles = root.querySelector('.sprinkles');
  const text = String(ctx.text || '');
  const isMine = Boolean(ctx.isMine);
  const lengthClass = text.length > 120
    ? 'tall'
    : text.length > 56
      ? 'long'
      : text.length > 18
        ? 'medium'
        : 'short';

  document.body.className = isMine ? 'is-mine' : 'is-other';
  root.className = `bubble ${isMine ? 'mine' : 'other'} ${lengthClass}`;
  content.textContent = text;
  if (!sprinkles) return;
  sprinkles.textContent = '';

  const shapes = isMine
    ? ['heart', 'star', 'dot', 'bean', 'dot', 'heart']
    : ['star', 'dot', 'heart', 'bean', 'dot', 'star'];

  shapes.forEach((shape, index) => {
    const mark = document.createElement('i');
    mark.className = `sprinkle ${shape}`;
    mark.style.setProperty('--spin', `${(text.length * (index + 3)) % 42 - 18}deg`);
    sprinkles.appendChild(mark);
  });
};

window.measureBubble = function measureBubble() {
  const root = document.getElementById('bubble');
  if (!root) return 0;
  const rect = root.getBoundingClientRect();
  const bodyStyle = window.getComputedStyle(document.body);
  const paddingBottom = parseFloat(bodyStyle.paddingBottom || '0') || 0;
  return Math.ceil(rect.bottom + paddingBottom);
};

<script>window.renderBubble = function renderBubble(ctx) {
  const root = document.getElementById('bubble');
  const content = document.getElementById('content');
  if (!root || !content) return;
  const sprinkles = root.querySelector('.sprinkles');
  const text = String(ctx.text || '');
  const isMine = Boolean(ctx.isMine);
  const lengthClass = text.length > 120
    ? 'tall'
    : text.length > 56
      ? 'long'
      : text.length > 18
        ? 'medium'
        : 'short';

  document.body.className = isMine ? 'is-mine' : 'is-other';
  root.className = `bubble ${isMine ? 'mine' : 'other'} ${lengthClass}`;
  content.textContent = text;
  if (!sprinkles) return;
  sprinkles.textContent = '';

  const shapes = isMine
    ? ['heart', 'star', 'dot', 'bean', 'dot', 'heart']
    : ['star', 'dot', 'heart', 'bean', 'dot', 'star'];

  shapes.forEach((shape, index) => {
    const mark = document.createElement('i');
    mark.className = `sprinkle ${shape}`;
    mark.style.setProperty('--spin', `${(text.length * (index + 3)) % 42 - 18}deg`);
    sprinkles.appendChild(mark);
  });
};

window.measureBubble = function measureBubble() {
  const root = document.getElementById('bubble');
  if (!root) return 0;
  const rect = root.getBoundingClientRect();
  const bodyStyle = window.getComputedStyle(document.body);
  const paddingBottom = parseFloat(bodyStyle.paddingBottom || '0') || 0;
  return Math.ceil(rect.bottom + paddingBottom);
};
