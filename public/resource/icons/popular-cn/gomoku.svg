<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EBE5D9"/>
    </linearGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4C8B2"/>
      <stop offset="100%" stop-color="#C2B49A"/>
    </linearGradient>
    
    <radialGradient id="blackStone" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="40%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    
    <radialGradient id="whiteStone" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D4D4D4"/>
    </radialGradient>

    <filter id="stoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="120" height="120" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="url(#gridLine)" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="20" x2="20" y2="100"/>
    <line x1="40" y1="20" x2="40" y2="100"/>
    <line x1="60" y1="20" x2="60" y2="100"/>
    <line x1="80" y1="20" x2="80" y2="100"/>
    <line x1="100" y1="20" x2="100" y2="100"/>
    
    <line x1="20" y1="20" x2="100" y2="20"/>
    <line x1="20" y1="40" x2="100" y2="40"/>
    <line x1="20" y1="60" x2="100" y2="60"/>
    <line x1="20" y1="80" x2="100" y2="80"/>
    <line x1="20" y1="100" x2="100" y2="100"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="60" cy="60" r="3" fill="#B3A387"/>
  
  <!-- Stones with beautiful shadows and gradients -->
  <!-- Black 1 -->
  <circle cx="60" cy="60" r="14" fill="url(#blackStone)" filter="url(#stoneShadow)"/>
  <!-- White 1 -->
  <circle cx="80" cy="60" r="14" fill="url(#whiteStone)" filter="url(#stoneShadow)"/>
  <!-- Black 2 -->
  <circle cx="80" cy="40" r="14" fill="url(#blackStone)" filter="url(#stoneShadow)"/>
  <!-- White 2 -->
  <circle cx="60" cy="40" r="14" fill="url(#whiteStone)" filter="url(#stoneShadow)"/>
  <!-- Black 3 (Winning move) -->
  <circle cx="40" cy="80" r="14" fill="url(#blackStone)" filter="url(#stoneShadow)"/>
</svg>
