<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient: Vibrant Macaron Pink (Standard iOS Style) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA6C9" />
      <stop offset="100%" stop-color="#FF4D85" />
    </linearGradient>

    <!-- Front of Envelope Gradient -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>

    <!-- Top Flap Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAFA" />
    </linearGradient>

    <!-- Heart Seal Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9E" />
      <stop offset="100%" stop-color="#FF1A5A" />
    </linearGradient>

    <!-- Professional Drop Shadows -->
    <!-- Envelope Base Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#C2295E" flood-opacity="0.6" />
    </filter>
    
    <!-- Top Flap Shadow (Creates depth for the overlapping paper) -->
    <filter id="flapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    
    <!-- Heart Seal Shadow -->
    <filter id="heartShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#D90040" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full Bleed Background (The OS will mask the rounded corners) -->
  <rect width="120" height="120" fill="url(#bgGrad)" />

  <!-- Envelope Graphic Group -->
  <!-- Centered perfectly within the 120x120 canvas. Dimensions: 80x56 -->
  <g filter="url(#iconShadow)">
    
    <!-- Envelope Front (Lower/Side Flaps combined into a single base shape) -->
    <!-- This creates a perfect rounded rectangle of 80x56 with the top flap cut out -->
    <path d="M 20 42 
             L 56 62 
             C 58.5 63.4 61.5 63.4 64 62 
             L 100 42 
             L 100 78 
             C 100 83.5 95.5 88 90 88 
             L 30 88 
             C 24.5 88 20 83.5 20 78 
             Z" 
          fill="url(#frontGrad)" />
    
    <!-- Diagonal Fold Lines (Simulates the classic envelope structure) -->
    <path d="M 23 85 L 53 65 M 97 85 L 67 65" stroke="#FFE1EB" stroke-width="1.5" stroke-linecap="round" />

    <!-- Envelope Top Flap (Overlaps the front) -->
    <path d="M 20 42 
             C 20 36.5 24.5 32 30 32 
             L 90 32 
             C 95.5 32 100 36.5 100 42 
             L 64 62 
             C 61.5 63.4 58.5 63.4 56 62 
             L 20 42 
             Z" 
          fill="url(#flapGrad)" filter="url(#flapShadow)" />
          
    <!-- Sharp highlight on the top fold of the flap to give paper thickness -->
    <path d="M 30 33 L 90 33" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Heart Seal (Centered over the tip of the flap, made smaller) -->
  <g filter="url(#heartShadow)">
    <path d="M 60 74 
             C 60 74 48 65 48 57.5 
             C 48 52 52 48.5 56.5 48.5 
             C 58.5 48.5 60 50 60 51.5 
             C 60 50 61.5 48.5 63.5 48.5 
             C 68 48.5 72 52 72 57.5 
             C 72 65 60 74 60 74 
             Z" 
          fill="url(#heartGrad)" />
  </g>
  
  <!-- Heart Glossy Highlight (Scaled down proportionally) -->
  <path d="M 52 55 C 53 51.5 55.5 51 57.5 51.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

</svg>